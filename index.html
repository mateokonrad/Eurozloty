<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konwerter Walut</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.box{
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    width:350px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
}

button{
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

#rates{
    margin-top:15px;
    color:#cbd5e1;
    font-size:14px;
}
</style>
</head>
<body>

<div class="box">

<h2>💱 Konwerter Walut</h2>

<input type="number" id="amount" value="100">

<select id="conversion">
    <option value="EURPLN">EUR → PLN</option>
    <option value="PLNEUR">PLN → EUR</option>

    <option value="USDPLN">USD → PLN</option>
    <option value="PLNUSD">PLN → USD</option>

    <option value="EURUSD">EUR → USD</option>
    <option value="USDEUR">USD → EUR</option>
</select>

<button onclick="convert()">Przelicz</button>

<div id="rates">Ładowanie kursów...</div>
<div id="result"></div>

</div>

<script>

let rates = {};

async function loadRates() {

    try {

        const response =
            await fetch("https://open.er-api.com/v6/latest/EUR");

        const data = await response.json();

        rates.EUR = 1;
        rates.PLN = data.rates.PLN;
        rates.USD = data.rates.USD;

        document.getElementById("rates").innerHTML =
            `
            1 EUR = ${rates.PLN.toFixed(4)} PLN<br>
            1 EUR = ${rates.USD.toFixed(4)} USD
            `;

    } catch(error){

        document.getElementById("rates").innerHTML =
            "Błąd pobierania kursów.";

        console.error(error);
    }
}

function convert(){

    if(!rates.PLN || !rates.USD){
        alert("Kursy jeszcze się ładują.");
        return;
    }

    const amount =
        parseFloat(document.getElementById("amount").value);

    const type =
        document.getElementById("conversion").value;

    let result = 0;
    let text = "";

    switch(type){

        case "EURPLN":
            result = amount * rates.PLN;
            text = `${amount} EUR = ${result.toFixed(2)} PLN`;
            break;

        case "PLNEUR":
            result = amount / rates.PLN;
            text = `${amount} PLN = ${result.toFixed(2)} EUR`;
            break;

        case "USDPLN":
            result = amount * (rates.PLN / rates.USD);
            text = `${amount} USD = ${result.toFixed(2)} PLN`;
            break;

        case "PLNUSD":
            result = amount / (rates.PLN / rates.USD);
            text = `${amount} PLN = ${result.toFixed(2)} USD`;
            break;

        case "EURUSD":
            result = amount * rates.USD;
            text = `${amount} EUR = ${result.toFixed(2)} USD`;
            break;

        case "USDEUR":
            result = amount / rates.USD;
            text = `${amount} USD = ${result.toFixed(2)} EUR`;
            break;
    }

    document.getElementById("result").innerHTML = text;
}

loadRates();

</script>

</body>
</html>
